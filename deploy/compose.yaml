services:
  collector:
    image: ghcr.io/joeyyax/collector:latest
    container_name: collector
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Longer than shutdown_timeout so the last log batch and cursors are saved.
    stop_grace_period: 20s
    environment:
      COLLECTOR_HOST: web-1
      # Bearer token for /metrics and /api/v1/*; /health stays open.
      COLLECTOR_API__TOKEN_FILE: /run/secrets/collector-token
      # Ship container logs to VictoriaLogs.
      COLLECTOR_LOGS__ENABLED: "true"
      COLLECTOR_LOGS__URL: http://victorialogs:9428
      # Optional push to VictoriaMetrics; otherwise scrape :9273/metrics.
      # COLLECTOR_REMOTE_WRITE__URL: http://victoriametrics:8428/api/v1/write
    ports:
      - "127.0.0.1:9273:9273"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - collector-state:/var/lib/collector
    secrets: [collector-token]
    # With COLLECTOR_CONTAINERS__WRITABLE_LAYER: "true", lets the size walk into directories containers keep private.
    # cap_add: [DAC_READ_SEARCH]
    # GPU hosts: uncomment so nvidia-smi is injected. pid: host lets it see container processes for per-container GPU memory.
    # runtime: nvidia
    # pid: host
    # environment:
    #   NVIDIA_VISIBLE_DEVICES: all
    #   NVIDIA_DRIVER_CAPABILITIES: utility

secrets:
  collector-token:
    file: ./collector-token

volumes:
  collector-state:
