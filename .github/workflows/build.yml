# Optional: the Makefile is the build. This mirrors `make test lint binaries image`.
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: make test lint binaries image
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
